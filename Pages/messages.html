<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <title>MoodClick Admin Dashboard</title>
</head>
<body>

<!-- Burger Menu -->
<div class="burger-menu">
  <input type="checkbox" id="burger-toggle">
  <label for="burger-toggle"></label>
</div>

<!-- Sidebar -->
<div class="sidebar">
  <ul>
    <li><a href="student-list.html">Student List</a></li>
    <li><a href="messages.html">Messages</a></li>
    <li><a href="counseling-chats.html">Counseling Chats</a></li>
  </ul>
</div>


<!-- Main content area -->
<div class="main-content">
  <!-- Navbar -->
  <div class="navbar">
    <div class="nav-title">MoodClick Admin Dashboard</div>
    <div class="profile-options">
      <div class="admin-profile" onclick="location.href='profile.html'">
        <img src="https://via.placeholder.com/36" alt="Admin Profile Picture">
        <span>Admin Name</span>
      </div>
      <a href="logout.html" onclick="confirmLogout()">Logout</a>
    </div>
  </div>
  <!-- Inbox area -->
  <div class="inbox">
    <!-- Example students -->
    <div class="inbox-item" id="student1" onclick="openChat('student1')">
      <div class="name">John Doe</div>
      <div class="date-time">Last conversation: 2024-09-12 14:00</div>
    </div>
    <div class="inbox-item" id="student2" onclick="openChat('student2')">
      <div class="name">Jane Smith</div>
      <div class="date-time">Last conversation: 2024-09-12 10:30</div>
    </div>

    <!-- Chat box inside the inbox -->
    <div class="chat-container" id="chat-container">
      <div class="chat-header">
        <div id="chat-header-text">Message Student</div>
        <button class="close-chat" onclick="closeChat()">Close</button>
      </div>
      <div id="chat-header" class="chat-header">Message Student</div>
      <div id="chat-box" class="chat-body"></div>
      <div class="chat-footer">
        <textarea id="message-input" placeholder="Type your message..."></textarea>
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

<!-- JavaScript -->
<script>
  // Sample chat data
  const chatHistory = {
    student1: [
      { sender: 'student', message: 'Hello Admin, I need help with my course.' },
      { sender: 'admin', message: 'Sure, how can I assist you?' },
    ],
    student2: [
      { sender: 'student', message: 'Hi Admin, I have a question about the project.' },
      { sender: 'admin', message: 'Of course! What would you like to know?' },
    ]
  };

  // Function to open the chat box
  function openChat(studentId) {
    const chatBox = document.getElementById('chat-box');
    const chatHeader = document.getElementById('chat-header');
    chatBox.innerHTML = ''; // Clear the current chat box

    // Get the chat history for the selected student
    const messages = chatHistory[studentId];
    const studentName = document.querySelector(`#${studentId} .name`).textContent;
    chatHeader.textContent = `Chat with ${studentName}`;

    // Load chat history into the chat box
    messages.forEach(msg => {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', msg.sender);
      messageDiv.textContent = msg.message;
      chatBox.appendChild(messageDiv);
    });

    // Show the chat container
    document.getElementById('chat-container').style.display = 'flex';
  }

  // Function to close the chat box
  function closeChat() {
    document.getElementById('chat-container').style.display = 'none';
  }

  // Function to send a message
  function sendMessage() {
    const messageInput = document.getElementById('message-input');
    const message = messageInput.value.trim();
    const chatBox = document.getElementById('chat-box');

    if (message !== '') {
      const newMessage = document.createElement('div');
      newMessage.classList.add('message', 'admin');
      newMessage.textContent = message;
      chatBox.appendChild(newMessage);

      chatBox.scrollTop = chatBox.scrollHeight; // Scroll to the bottom
      messageInput.value = ''; // Clear the input field
    }
  }
</script>

</body>
</html>
